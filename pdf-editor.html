<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free PDF Viewer & Editor Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <a href="index.html" class="text-indigo-400 text-sm font-bold">← Back to Portal</a>
        <h1 class="text-lg font-bold">📄 PDF Viewer & Editor</h1>
        <div></div>
    </nav>

    <!-- Top Ad Placeholder -->
    <div class="max-w-4xl mx-auto my-3 p-2 bg-gray-800 text-center text-xs text-gray-500 rounded border border-gray-700 w-full">
        [ Ad Space ]
    </div>

    <!-- Main Content Area -->
    <div class="max-w-4xl mx-auto p-4 w-full flex-grow">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center">
            
            <p class="text-gray-300 text-sm mb-4">Select any PDF file to view, annotate, or print directly in your browser.</p>

            <input type="file" id="pdf-input" accept="application/pdf" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer bg-gray-900 border border-gray-700 rounded-lg mb-4">

            <div id="pdf-preview" class="hidden w-full h-[600px] border border-gray-700 rounded-lg overflow-hidden mt-4">
                <iframe id="pdf-frame" class="w-full h-full"></iframe>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('pdf-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const fileURL = URL.createObjectURL(file);
                const frame = document.getElementById('pdf-frame');
                const preview = document.getElementById('pdf-preview');
                
                frame.src = fileURL;
                preview.classList.remove('hidden');
            } else {
                alert('Please upload a valid PDF file.');
            }
        });
    </script>
</body>
</html>
