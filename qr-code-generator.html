<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <a href="index.html" class="text-indigo-400 text-sm font-bold">← Back to Portal</a>
        <h1 class="text-lg font-bold">📱 QR Code Generator</h1>
        <div></div>
    </nav>

    <!-- Top Ad Placeholder -->
    <div class="max-w-xl mx-auto my-4 p-2 bg-gray-800 text-center text-xs text-gray-500 rounded border border-gray-700">
        [ Ad Space ]
    </div>

    <div class="max-w-xl mx-auto p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center">
            <label class="block mb-2 text-sm font-medium text-gray-300 text-left">Enter Text or URL:</label>
            <input type="text" id="qr-text" placeholder="https://example.com or any text" class="w-full p-3 rounded bg-gray-900 border border-gray-700 text-white mb-4 focus:outline-none focus:border-indigo-500">
            
            <button onclick="generateQR()" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-3 px-4 rounded transition">Generate QR Code</button>

            <div id="qrcode" class="mt-6 flex justify-center bg-white p-4 rounded-lg hidden w-max mx-auto"></div>
        </div>
    </div>

    <script>
        function generateQR() {
            const text = document.getElementById('qr-text').value;
            const qrContainer = document.getElementById('qrcode');
            
            if (!text) {
                alert('Please enter text or a URL first!');
                return;
            }

            qrContainer.innerHTML = '';
            qrContainer.classList.remove('hidden');

            new QRCode(qrContainer, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
