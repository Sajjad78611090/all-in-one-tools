<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator - Free Online Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <a href="index.html" class="text-indigo-400 text-sm font-bold">← Back to Portal</a>
        <h1 class="text-lg font-bold">🎨 AI Image Generator</h1>
        <div></div>
    </nav>

    <!-- Top Ad Placeholder -->
    <div class="max-w-xl mx-auto my-4 p-2 bg-gray-800 text-center text-xs text-gray-500 rounded border border-gray-700">
        [ Ad Space ]
    </div>

    <div class="max-w-xl mx-auto p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <label class="block mb-2 text-sm font-medium text-gray-300">Enter Prompt:</label>
            <input type="text" id="prompt" placeholder="e.g. Cyberpunk city in rain, 8k resolution..." class="w-full p-3 rounded bg-gray-900 border border-gray-700 text-white mb-4 focus:outline-none focus:border-indigo-500">
            
            <button onclick="generateImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-3 px-4 rounded transition">Generate Image</button>

            <!-- Loading Spinner & Output -->
            <div id="status" class="hidden text-center my-4 text-indigo-400 text-sm font-medium">Generating image, please wait...</div>
            <div id="output" class="mt-4 text-center"></div>
        </div>
    </div>

    <script>
        function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            if (!prompt) {
                alert('Please enter a prompt first!');
                return;
            }

            status.classList.remove('hidden');
            output.innerHTML = '';

            // Using reliable Flux model with cache buster
            const randomSeed = Math.floor(Math.random() * 99999);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${randomSeed}&model=flux&nologo=true`;

            const img = document.createElement('img');
            img.src = imageUrl;
            img.className = "w-full rounded-lg border border-gray-700 shadow-lg mt-2";
            
            img.onload = function() {
                status.classList.add('hidden');
                output.appendChild(img);
                output.innerHTML += `<br><a href="${imageUrl}" target="_blank" download="ai-image.jpg" class="inline-block mt-3 bg-green-600 hover:bg-green-700 text-xs text-white font-bold py-2 px-4 rounded">Download Image</a>`;
            };

            img.onerror = function() {
                status.classList.add('hidden');
                output.innerHTML = `<div class="bg-red-900/50 border border-red-700 text-red-200 p-3 rounded-lg text-sm mt-2">Server busy, please click Generate again.</div>`;
            };
        }
    </script>
</body>
</html>
